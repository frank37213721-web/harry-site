# Decap CMS 設定 — 詳細說明見 ARTICLES-SETUP.md
#
# 正式網域：www.harryhsieh.com 為 Vercel 主網域（harryhsieh.com 會 308 轉到 www）。
# 這三處網域必須跟「實際開啟後台的網址」以及 GitHub OAuth App 的 Redirect URI 完全一致。

backend:
  name: github
  repo: frank37213721-web/harry-site
  branch: main
  base_url: https://www.harryhsieh.com
  auth_endpoint: api/auth

site_url: https://www.harryhsieh.com
display_url: https://www.harryhsieh.com

media_folder: assets/uploads
public_folder: /assets/uploads

locale: zh_Hant

collections:
  - name: articles
    label: 文章
    label_singular: 文章
    folder: content/articles
    create: true
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: 標題, widget: string }
      - {
          name: date,
          label: 發布日期,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
        }
      - {
          name: slug,
          label: 網址代稱,
          widget: string,
          pattern: ["^[a-z0-9-]+$", "只能用英文小寫、數字、連字號（不能有空格、點、中文）"],
          hint: "例如 why-ai-teaching。這會變成文章網址 /articles/why-ai-teaching，每篇要不一樣。",
        }
      - {
          name: summary,
          label: 摘要（文章列表與分享時顯示）,
          widget: text,
          required: false,
        }
      - { name: tag, label: 分類標籤, widget: string, required: false }
      - {
          name: draft,
          label: "隱藏這篇（勾選＝不出現在網站上；預設會發佈）",
          widget: boolean,
          default: false,
        }
      - {
          name: external,
          label: "外部文章連結（發表在 Medium 等平台時貼網址；填了就用不到下面的內文）",
          widget: string,
          required: false,
        }
      - { name: body, label: 內文, widget: markdown, required: false }
